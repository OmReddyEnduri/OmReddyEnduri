<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="footer-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="wave-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="16" fill="url(#footer-bg)"/>
  <rect width="1198" height="118" x="1" y="1" rx="15" fill="none" stroke="url(#footer-accent)" stroke-width="1.5" opacity="0.5"/>

  <!-- Wave at top of footer -->
  <path d="M0,40 C300,10 600,60 900,20 C1050,0 1150,30 1200,15 L1200,0 L0,0 Z" fill="url(#wave-footer)"/>

  <!-- Center Quote -->
  <text x="600" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#00F0FF" letter-spacing="1.5">
    while (curious) { learn(); build(); solve(); optimize(); }
  </text>
  <text x="600" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8B949E">
    Thanks for visiting my profile — see you in the next commit.
  </text>
</svg>
